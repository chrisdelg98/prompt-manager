<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prompt Manager</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="index">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-inner">
          <div class="brand-row">
            <a class="brand" href="index.html">
              <div class="brand-mark">P</div>
              <div>
                <h1>Prompt Manager</h1>
                <p>Gestiona tus prompts</p>
              </div>
            </a>
            <button class="sidebar-close" id="sidebarClose" title="Cerrar menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
          </div>

          <a class="primary-button wide-button" href="new.html">
            <span class="button-icon">+</span>
            Nuevo proyecto
          </a>

          <label class="search-box">
            <span class="visually-hidden">Buscar</span>
            <input id="globalSearch" type="search" placeholder="Buscar proyectos...">
          </label>

          <nav class="sidebar-menu" aria-label="Filtros">
            <button class="menu-item active" type="button" id="allProjectsFilter"><span>[]</span> Todos los proyectos <b id="allProjectsCount">0</b></button>
            <button class="menu-item" type="button" id="favoritesFilter"><span>*</span> Favoritos <b id="favoritesCount">0</b></button>
          </nav>

          <div class="sidebar-block sidebar-projects">
            <div class="sidebar-block-title">Proyectos</div>
            <div class="project-sort">
              <select id="sortSelect">
                <option value="updatedDesc">Recientes</option>
                <option value="createdDesc">Creados</option>
                <option value="nameAsc">Nombre A-Z</option>
              </select>
            </div>
            <nav id="projectList" class="project-list" aria-label="Proyectos"></nav>
          </div>

          <div class="sidebar-footer">
            <div class="avatar">CO</div>
            <div>
              <strong>Chris One</strong>
              <span><em id="storageText">0 KB</em></span>
            </div>
            <button class="icon-button small" id="themeToggle" data-tooltip="Cambiar tema">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="icon-button small" id="linkFileBtn" data-tooltip="Vincular archivo de datos">
              <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="menu-toggle" id="sidebarToggle" data-tooltip="Mostrar menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
          </button>
          <div class="project-heading">
            <p class="breadcrumb" id="projectMeta">Biblioteca / Todos los proyectos</p>
            <div class="title-row">
              <h2 id="projectTitle">Biblioteca de proyectos</h2>
            </div>
          </div>
        </header>

        <section class="library-panel" id="libraryPanel">
          <div class="library-head">
            <div>
              <h3>Biblioteca de proyectos</h3>
              <p>Resumen general de todos los prompts, proyectos, secciones y categorias.</p>
            </div>
            <div class="library-tools">
              <select id="librarySortSelect">
                <option value="updatedDesc">Mas recientes</option>
                <option value="createdDesc">Creados</option>
                <option value="nameAsc">Nombre A-Z</option>
              </select>
              <a class="primary-button" href="new.html">Nuevo proyecto</a>
            </div>
          </div>
          <div class="library-summary" id="librarySummary"></div>
          <div class="library-grid" id="libraryGrid"></div>
          <div class="library-cats">
            <span class="library-cats-label">Categorias</span>
            <div class="tag-cloud" id="libraryCategories"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
