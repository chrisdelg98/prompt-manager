<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo proyecto - Prompt Manager</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="new">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-inner">
          <a class="brand" href="index.html">
            <div class="brand-mark">P</div>
            <div>
              <h1>Prompt Manager</h1>
              <p>Gestiona tus prompts</p>
            </div>
          </a>

          <a class="primary-button wide-button" href="new.html">
            <span class="button-icon">+</span>
            Nuevo proyecto
          </a>

          <label class="search-box">
            <span class="visually-hidden">Buscar</span>
            <input id="globalSearch" type="search" placeholder="Buscar proyectos...">
          </label>

          <nav class="sidebar-menu" aria-label="Filtros">
            <button class="menu-item active" type="button" id="allProjectsFilter"><span>[]</span> Todos los proyectos <b id="allProjectsCount">0</b></button>
            <button class="menu-item" type="button" id="favoritesFilter"><span>*</span> Favoritos <b id="favoritesCount">0</b></button>
          </nav>

          <div class="sidebar-block sidebar-projects">
            <div class="sidebar-block-title">Proyectos</div>
            <div class="project-sort">
              <select id="sortSelect">
                <option value="updatedDesc">Recientes</option>
                <option value="createdDesc">Creados</option>
                <option value="nameAsc">Nombre A-Z</option>
              </select>
            </div>
            <nav id="projectList" class="project-list" aria-label="Proyectos"></nav>
          </div>

          <div class="sidebar-footer">
            <div class="avatar">CO</div>
            <div>
              <strong>Chris One</strong>
              <span><em id="storageText">0 KB</em></span>
            </div>
            <button class="icon-button small" id="themeToggle" data-tooltip="Cambiar tema">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="icon-button small" id="linkFileBtn" data-tooltip="Vincular archivo de datos">
              <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="project-heading">
            <p class="breadcrumb" id="projectMeta">Biblioteca / Crear proyecto</p>
            <div class="title-row">
              <h2 id="projectTitle">Nuevo proyecto</h2>
            </div>
            <div class="project-facts" id="projectFacts"></div>
          </div>
        </header>

        <section class="composer create-panel">
          <div class="composer-head">
            <div>
              <h3>Entrada estructurada <span>(nuevo proyecto)</span></h3>
              <p>Pega un bloque completo. Cada linea con @ crea una seccion nueva.</p>
            </div>
            <div class="composer-actions">
              <button class="ghost-button" id="exampleBtn">Cargar ejemplo</button>
              <button class="primary-button" id="parseBtn">Parsear y guardar</button>
            </div>
          </div>
          <textarea id="sourceInput" spellcheck="false" placeholder="@PROJECT: Galaxies&#10;@GENRE: Space Trance&#10;&#10;@SUNO&#10;prompt..."></textarea>
          <div class="empty-actions">
            <button class="quick-action" id="importBtn">
              <span>UP</span>
              <strong>Importar</strong>
              <small>Desde archivo</small>
            </button>
            <button class="quick-action" id="backupBtn">
              <span>BK</span>
              <strong>Backup</strong>
              <small>Exportar todo</small>
            </button>
            <input type="file" id="importFile" accept=".json,.txt,text/plain,application/json" hidden>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
